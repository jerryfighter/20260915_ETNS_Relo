{% extends "base.html" %}
{% block title %}Sign Up - Expat Review Korea{% endblock %}

{% block content %}
<div class="container">
  <div class="card mx-auto mt-4 p-4" style="max-width: 480px;">
    <h3 class="mb-1">Create an Account</h3>
    <p class="text-muted">Join to share your real living experience in Korea.</p>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ form.email or '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Nickname <span class="text-muted small">(shown publicly instead of your real name)</span></label>
        <input type="text" name="nickname" class="form-control" value="{{ form.nickname or '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Nationality <span class="text-muted small">(optional, shown as e.g. "American Expat")</span></label>
        <input type="text" name="nationality" class="form-control" value="{{ form.nationality or '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Password <span class="text-muted small">(min 8 characters)</span></label>
        <input type="password" name="password" class="form-control" minlength="8" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" minlength="8" required>
      </div>
      <button type="submit" class="btn w-100 text-white" style="background-color: var(--brand-primary);">Sign Up</button>
    </form>
    <p class="text-center mt-3 mb-0">
      Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
