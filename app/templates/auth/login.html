{% extends "base.html" %}
{% block title %}Log In - Expat Review Korea{% endblock %}

{% block content %}
<div class="container">
  <div class="card mx-auto mt-4 p-4" style="max-width: 420px;">
    <h3 class="mb-3">Log In</h3>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ email }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn w-100 text-white" style="background-color: var(--brand-primary);">Log In</button>
    </form>
    <p class="text-center mt-3 mb-0">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}
