{% extends "base.html" %}
{% block title %}Edit Review - {{ area.name }}{% endblock %}

  <p class="text-muted mb-4">Update your experience for <strong>{{ area.name }}</strong>.</p>
  <div class="card p-4">
    {% set submit_label = "Save Changes" %}

  </div>
</div>
{% endblock %}
